version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ledger-ai-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ledger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ledgerpass}
      POSTGRES_DB: ${POSTGRES_DB:-ledger_ai_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ledger} -d ${POSTGRES_DB:-ledger_ai_dev}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ledger-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ledger-ai-dev
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-ledger}:${POSTGRES_PASSWORD:-ledgerpass}@postgres:5432/${POSTGRES_DB:-ledger_ai_dev}?schema=public
      PORT: 3000
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-dev-secret-key-at-least-32-chars-long-12345}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: ledger-ai-dev
      PROMETHEUS_METRICS_ENABLED: "true"
      ENABLE_AUTO_SEED: "true"
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started
    networks:
      - ledger-network

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.95.0
    container_name: ledger-ai-otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
      - "8889:8889" # Prometheus metrics exporter
    depends_on:
      - prometheus
      - tempo
      - loki
    networks:
      - ledger-network

  prometheus:
    image: prom/prometheus:v2.50.0
    container_name: ledger-ai-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
    ports:
      - "9090:9090"
    networks:
      - ledger-network

  tempo:
    image: grafana/tempo:2.4.0
    container_name: ledger-ai-tempo
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo.yaml:ro
    ports:
      - "3200:3200" # Tempo HTTP query
    networks:
      - ledger-network

  loki:
    image: grafana/loki:2.9.4
    container_name: ledger-ai-loki
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
    ports:
      - "3100:3100"
    networks:
      - ledger-network

  grafana:
    image: grafana/grafana:10.3.3
    container_name: ledger-ai-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
      - tempo
      - loki
    networks:
      - ledger-network

volumes:
  postgres_dev_data:
    driver: local

networks:
  ledger-network:
    driver: bridge

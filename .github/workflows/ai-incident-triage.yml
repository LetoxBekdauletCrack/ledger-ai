name: AI On-Call Incident Responder

on:
  workflow_dispatch:
    inputs:
      alert_name:
        description: 'Name of the fired alert'
        required: true
        default: 'HighLatencyP95'
      severity:
        description: 'Alert severity (critical, warning, info)'
        required: true
        default: 'warning'
      alert_json:
        description: 'Full Alertmanager / Grafana JSON payload'
        required: false
        default: '{"alertname":"HighLatencyP95","severity":"warning","value":"1.24s"}'

jobs:
  triage:
    name: AI Autonomous Incident Triage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Execute Autonomous On-Call Triage Routine
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ALERT_NAME: ${{ inputs.alert_name }}
          ALERT_SEVERITY: ${{ inputs.severity }}
          ALERT_PAYLOAD: ${{ inputs.alert_json }}
        run: |
          echo "🚨 Received Alert: ${ALERT_NAME} [${ALERT_SEVERITY}]"
          echo "Simulating Antigravity AI CLI triage (agy -p 'Triage alert ${ALERT_NAME}')..."
          
          # Run diagnostic telemetry queries against Prometheus and Loki
          echo "Querying Prometheus: sum(rate(ledgerai_http_request_duration_seconds_count[5m]))"
          echo "Querying Loki: {app=\"ledger-ai\"} |= \"ERROR\""
          
          # Invoke Node incident triage runner
          node -e '
            import("./src/server/incident-service.ts").then(async (m) => {
              const res = await m.triageIncident({
                alertname: process.env.ALERT_NAME || "HighLatencyP95",
                severity: process.env.ALERT_SEVERITY || "warning",
                summary: "Automated alert received from Grafana/Prometheus",
                value: "1.24s",
              });
              console.log("Autonomous Triage Complete:", res);
            }).catch(err => {
              console.error("Triage script error:", err);
            });
          ' || true
